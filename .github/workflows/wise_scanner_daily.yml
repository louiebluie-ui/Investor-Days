name: Wise Scanner Engine Daily Run

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: wise-scanner-production
  cancel-in-progress: true

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15 
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scout
        run: python scout.py

      - name: Commit Updated Database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Auto-updated Investor Day Calendar
          file_pattern: investor_days.json

      - name: Execute Wise Scanner Engine
        id: run_engine
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          python scanner.py
          if [ -s "email_table.html" ]; then
            echo "setups_found=true" >> $GITHUB_OUTPUT
          else
            echo "setups_found=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Store Daily Report Artifact
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: wise-scanner-daily-csv
          path: daily_report.csv
          retention-days: 90
          if-no-files-found: ignore

      - name: Dispatch Success Alert
        if: steps.run_engine.outputs.setups_found == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }} 
          subject: Wise Scanner ALERT Verified Asymmetric Coiled Springs
          to: ${{ secrets.ALERT_EMAIL_ADDRESS }}
          from: Wise Scanner Quant Engine
          html_body: file://email_table.html
          attachments: daily_report.csv

      - name: Dispatch Failure Alert
        if: failure() 
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }} 
          subject: CRITICAL Wise Scanner Quant Engine Crashed
          to: ${{ secrets.ALERT_EMAIL_ADDRESS }}
          from: Wise Scanner Quant Engine
          body: The serverless Python engine encountered a fatal error and crashed before completing the daily scan.
